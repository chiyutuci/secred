# F234_S: the same family at numeric dimension (1999/500) with symbolic
# kinematics s, t, reduced with Kira.
family:
  name: 234
  dimension: 1999/500
  internals: [ l1, l2 ]
  externals: [ p1, p2, p3 ]
  invariants:
    - [ s, 2 ]
    - [ t, 2 ]
  sps_rules:
    - [ p1, p1, 0 ]
    - [ p2, p2, 0 ]
    - [ p3, p3, 0 ]
    - [ p1, p2, s ]
    - [ p1, p3, t ]
    - [ p2, p3, 9/2-s-t ]
  propagators:
    - [ l1, 3/2 ]
    - [ l1-p2, 3/2 ]
    - [ l1+p1/2-p2/2+p3/2, 0 ]
    - [ l2, 3/2 ]
    - [ l2+p3, 3/2 ]
    - [ l2-p1/2-p2/2+p3/2, 0 ]
    - [ l1+l2-p1/2-p2/2+p3/2, 3/2 ]
    - [ l1+l2+p1/2-p2/2+p3/2, 3/2 ]
    - [ l1+p1, 0 ]

settings:
  threads: 64                 # worker threads for the sector-wise reduction (default: 64)
  parallel_mode: fine         # schedule sectors individually (fine) or layer by layer (layer)
  subsector_depth_offset: 1   # depth offset n for the subsector filter: depth < _depth - n
  cache_dir: cache_F234_S     # directory for the global system and Kira scratch files

targets:
  - [1, 0, 1, 1, 0, 0, 0, 0, 0]
