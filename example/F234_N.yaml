# F234_N: two-loop three-point non-planar family, numeric (dimension = 1999/500),
# reduced in-process with FiniteFlow.
family:
  name: F234
  dimension: 1999/500
  internals: [ l1, l2 ]
  externals: [ p1, p2, p3 ]
  invariants:
  sps_rules:
    - [ p1, p1, 0 ]
    - [ p2, p2, 0 ]
    - [ p3, p3, 0 ]
    - [ p1, p2, 1/3 ]
    - [ p1, p3, 1/7 ]
    - [ p2, p3, 9/2-1/3-1/7 ]
  propagators:
    - [ l1, 3/2 ]
    - [ l1-p2, 3/2 ]
    - [ l1+p1/2-p2/2+p3/2, 0 ]
    - [ l2, 3/2 ]
    - [ l2+p3, 3/2 ]
    - [ l2-p1/2-p2/2+p3/2, 0 ]
    - [ l1+l2-p1/2-p2/2+p3/2, 3/2 ]
    - [ l1+l2+p1/2-p2/2+p3/2, 3/2 ]
    - [ l1+p1, 0 ]

settings:
  threads: 64                 # worker threads for the sector-wise reduction (default: 64)
  parallel_mode: fine         # schedule sectors individually (fine) or layer by layer (layer)
  subsector_depth_offset: 1   # depth offset n for the subsector filter: depth < _depth - n
  cache_dir: cache_F234_N     # directory for the global system and scratch files
  global_tool: finiteflow     # numeric system: reduce in-process with FiniteFlow
  global_finiteflow_threads: 64

