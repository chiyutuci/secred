# F234_N: two-loop five-point non-planar family, numeric (dimension = 1999/500),
# reduced in-process with FiniteFlow.  The J/psi leg p4 appears as two c-cbar
# constituent legs of p4/2 each, hence 5 external legs but only E = 3 independent
# external momenta (the three externals below, with p4 = p1+p2+p3).
family:
  name: F234
  dimension: 1999/500
  internals: [ l1, l2 ]
  externals: [ p1, p2, p3 ]
  invariants:
  sps_rules:
    - [ p1, p1, 0 ]
    - [ p2, p2, 0 ]
    - [ p3, p3, 0 ]
    - [ p1, p2, 1/3 ]
    - [ p1, p3, 1/7 ]
    - [ p2, p3, 9/2-1/3-1/7 ]
  propagators:
    - [ l1, 3/2 ]
    - [ l1-p2, 3/2 ]
    - [ l1+p1/2-p2/2+p3/2, 0 ]
    - [ l2, 3/2 ]
    - [ l2+p3, 3/2 ]
    - [ l2-p1/2-p2/2+p3/2, 0 ]
    - [ l1+l2-p1/2-p2/2+p3/2, 3/2 ]
    - [ l1+l2+p1/2-p2/2+p3/2, 3/2 ]
    - [ l1+p1, 0 ]

settings:
  sthreads: 64                # worker threads for the sector-wise reduction (default: 64)
  parallel_mode: fine         # schedule sectors individually (fine) or layer by layer (layer)
  subsector_filter_n: 1       # subsector filter offset n: a subsector integral is dropped when
                              # its boundary quantity (depth + rank) falls more than n below
                              # the boundary (0 = drop every subsector integral)
  cache_dir: cache_F234_N     # directory for the run's output (reductions, masters, logs)
  gthreads: 64                # threads for the global phase's reconstruction; defaults to sthreads

