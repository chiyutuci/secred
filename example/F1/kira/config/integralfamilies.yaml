integralfamilies:
  - name: "fam1"
    loop_momenta: [l1, l2, l3, l4]
    top_level_sectors: [8191]
    cut_propagators: [1, 2, 3]
    propagators:
      - [ "l3^2", 0 ]
      - [ "l4^2", 0 ]
      - [ "(l3 + l4 - p)^2", 0 ]
      - [ "-1 + (l2 - l3 + p)^2", 0 ]
      - [ "-1 + l1^2", 0 ]
      - [ "(l1 + p/2)^2", 0 ]
      - [ "-1 + l2^2", 0 ]
      - [ "(l1 + l2 + p)^2", 0 ]
      - [ "-1 + (l1 + l2 + p/2)^2", 0 ]
      - [ "-1 + (l3 - p/2)^2", 0 ]
      - [ "-1 + (l1 + l3)^2", 0 ]
      - [ "-1 + (l4 - p/2)^2", 0 ]
      - [ "-1 + (l2 + l4)^2", 0 ]
      - [ "(l1 + l4)^2", 0 ]
