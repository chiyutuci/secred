# F234_S: the same family at numeric dimension (1999/500) with symbolic
# kinematics s, t, reduced in-process.
family:
  name: 234
  dimension: 1999/500
  internals: [ l1, l2 ]
  externals: [ p1, p2, p3 ]
  invariants:
    - [ s, 2 ]
    - [ t, 2 ]
  sps_rules:
    - [ p1, p1, 0 ]
    - [ p2, p2, 0 ]
    - [ p3, p3, 0 ]
    - [ p1, p2, s ]
    - [ p1, p3, t ]
    - [ p2, p3, 9/2-s-t ]
  propagators:
    - [ l1, 3/2 ]
    - [ l1-p2, 3/2 ]
    - [ l1+p1/2-p2/2+p3/2, 0 ]
    - [ l2, 3/2 ]
    - [ l2+p3, 3/2 ]
    - [ l2-p1/2-p2/2+p3/2, 0 ]
    - [ l1+l2-p1/2-p2/2+p3/2, 3/2 ]
    - [ l1+l2+p1/2-p2/2+p3/2, 3/2 ]
    - [ l1+p1, 0 ]

settings:
  sthreads: 64                # worker threads for the sector-wise reduction (default: min(64, hardware thread count))
  parallel_mode: fine         # schedule sectors individually (fine) or layer by layer (layer)
  subsector_filter_n: 1       # subsector filter offset n: a subsector integral is dropped when
                              # its boundary quantity (depth + rank) falls more than n below
                              # the boundary (0 = drop every subsector integral)
  ordering_mode: balance      # integral ordering: normal (generation order) | balance (default;
                              # seeds, subsector columns and the global numbering all follow the
                              # balance key: total power, depth, rank, max denominator power,
                              # max numerator power)
  gthreads: 64                # threads for the global phase's reconstruction; defaults to sthreads
  cache_dir: cache_F234_S     # directory for the run's output (reductions, masters, logs)

targets:
