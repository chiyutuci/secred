# F234 (fam4) at symbolic d, Kira 3.1, seed-truncated: one seed box per sector.
# Same family, target list and selection as job_no_truncate.yaml; only the single
# top-sector box is replaced by 256 per-sector boxes, one per subsector:
#
#   t = popcount(sector)     dots(v) = sum of positive indices - t
#   rank(v) = sum of |negative indices|
#   D = max dots over the sector's own targets (0 if none)
#   R = max rank over the sector's own targets (0 if none)
#   r = t + D        d = D        s = max(min(R + 1, t - 2, SMAX), 0)     SMAX = 4
#   a sector without targets gets (r, s, d) = (t, 0, 0)
#
# in Kira's units (r = max total positive index, s = max rank, d = max dots).
# All 860 targets lie inside their own sector's box; the boxes are generated by
# bench/F234/kira31_symd_top255_2026-10-21/make_inputs.py (there: jobs_trunc.yaml).
# Sector 255 is (8, 4, 0), the same box job_no_truncate.yaml gives every sector.
#
# 172,561 equations, 241.7 s,
# 6.22 GiB, 346 masters, 0 unreduced.  The basis is a strict superset of the
# untruncated 309 (37 extra masters in 20 subsectors).
jobs:
 - reduce_sectors:
    reduce:
      - {topologies: [fam4], sectors: [255], r: 8, s: 4, d: 0}
      - {topologies: [fam4], sectors: [254], r: 7, s: 0, d: 0}
