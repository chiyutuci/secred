family:
  name: box
  dimension: d
  internals: [ l1 ]
  externals: [ p1, p2, p3 ]
  invariants:
    - [ s, 2 ]
    - [ t, 2 ]
    - [ m, 1 ]
  sps_rules:
    - [ p1, p1, m^2 ]
    - [ p2, p2, m^2 ]
    - [ p3, p3, m^2 ]
    - [ p1, p2, t-m^2 ]
    - [ p1, p3, s-m^2 ]
    - [ p2, p3, -t-s-m^2 ]
  propagators:
    - [ l1, m ]
    - [ l1+p1, 0 ]
    - [ l1+p1+p2, m ]
    - [ l1+p1+p2+p3, 0 ]
  # cut: [0, 0, 0, 0]

settings:
  threads: 64                 # worker threads for the sector-wise reduction (default: 64)
  parallel_mode: fine         # schedule sectors individually (fine) or layer by layer (layer)
  subsector_filter_n: 1       # subsector filter offset n: a subsector integral is dropped when
                              # its boundary quantity (depth + rank) falls more than n below
                              # the boundary (0 = drop every subsector integral)
  ordering_mode: balance      # integral ordering: normal (generation order) | balance (default;
                              # seeds, subsector columns and the global numbering all follow the
                              # balance key: total power, depth, rank, max denominator power,
                              # max numerator power)
  global_tool: finiteflow     # global reducer: finiteflow (default, in-process) | firefly
                              # (FireFly's reconstructor); global_finiteflow_threads sets the
                              # reconstruction's thread count
  cache_dir: cache_box        # directory for the global system and scratch files

targets:
  - [ 2, 2, 1, 1 ]
  - [ 1, 2, 1, 1 ]
  - [ 1, 1, 2, 1 ]
  - [ 1, 1, -1, 2 ]
