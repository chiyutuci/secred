family:
  name: box
  dimension: d
  internals: [ l1 ]
  externals: [ p1, p2, p3 ]
  invariants:
    - [ s, 2 ]
    - [ t, 2 ]
    - [ m, 1 ]
  sps_rules:
    - [ p1, p1, m^2 ]
    - [ p2, p2, m^2 ]
    - [ p3, p3, m^2 ]
    - [ p1, p2, t-m^2 ]
    - [ p1, p3, s-m^2 ]
    - [ p2, p3, -t-s-m^2 ]
  propagators:
    - [ l1, m ]
    - [ l1+p1, 0 ]
    - [ l1+p1+p2, m ]
    - [ l1+p1+p2+p3, 0 ]
  # cut: [0, 0, 0, 0]

settings:
  sthreads: 64                # worker threads for the sector-wise reduction (default: 64)
  parallel_mode: fine         # schedule sectors individually (fine) or layer by layer (layer)
  subsector_filter_n: 1       # subsector filter offset n: a subsector integral is dropped when
                              # its boundary quantity (depth + rank) falls more than n below
                              # the boundary (0 = drop every subsector integral)
  # seed_level_offset is optional: when absent, the rule reads the targets --
  # offset 1 when they carry dots (this file derives 2), and offset 0 when they
  # are pure denominators.  Setting it fixes the relaxation:
  # l = max(0, popcount(top) - s_max - offset) (larger relaxes more, generating
  # more equations).
  ordering_mode: balance      # integral ordering: normal (generation order) | balance (default;
                              # seeds, subsector columns and the global numbering all follow the
                              # balance key: total power, depth, rank, max denominator power,
                              # max numerator power)
  sector_debug: false         # when a pass finds its seed box too small, append the pass's own
                              # masters, the figures the criterion read and its verdicts to the
                              # sector log (default false; a diagnostic, the reduction is the same)
  gthreads: 64                # threads for the global phase's reconstruction; defaults to sthreads
  cache_dir: cache_box        # directory for the run's output (reductions, masters, logs)

targets:
  - [ 2, 2, 1, 1 ]
  - [ 1, 2, 1, 1 ]
  - [ 1, 1, 2, 1 ]
  - [ 1, 1, -1, 2 ]

# preferred: master integrals the user asks for (optional; same syntax as
# targets, and read from the same level).  An entry that takes part in the
# reduction is ordered as the simplest integral of its sector, so the elimination
# keeps it; an entry that never appears -- dropped by the subsector filter, or its
# sector is not reached -- is ignored, and the reduction itself is unchanged
# either way.  The list is a set: the order of its entries does not matter.  Keep
# this block commented out: this file's md5s are pinned by the smoke test.
# preferred:
#   - [ 0, 0, 1, 0 ]
